<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AIGC 视频 — 高一博</title>
  <meta name="description" content="高一博的 TVC 广告、AIGC 视频与 AIGC 漫剧作品总览。">
  <style>
    :root{--blue:#078fd2;--white:#fff;--ink:#f8fbfd;--muted:rgba(255,255,255,.62);--line:rgba(255,255,255,.26);--ease:cubic-bezier(.16,1,.3,1)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100svh;background:var(--blue);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button{font:inherit}img{display:block;max-width:100%}.shell{width:min(calc(100% - 96px),1440px);margin-inline:auto}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:92px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:760;letter-spacing:.1em;text-transform:uppercase}.brand::before{content:"";width:18px;height:18px;border:5px solid currentColor;border-right-color:transparent;border-radius:50%;transform:rotate(-24deg)}.back{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border:1px solid rgba(255,255,255,.52);border-radius:999px;font-size:16px;font-weight:700;transition:background .25s,color .25s}.back:hover,.back:focus-visible{background:#fff;color:var(--blue);outline:none}
    .hero{display:grid;grid-template-columns:7fr 5fr;gap:64px;align-items:end;padding:88px 0 56px}.eyebrow{margin:0 0 20px;color:rgba(255,255,255,.72);font-size:14px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}h1{margin:0;white-space:nowrap;font-size:clamp(68px,7vw,108px);font-weight:560;letter-spacing:-.07em;line-height:.92}.intro{max-width:560px;margin:0 0 10px;font-size:20px;line-height:1.75}
    .category-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.category-nav button{min-height:78px;padding:0 22px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);text-align:left;cursor:pointer;font-size:19px;font-weight:700;transition:background .25s,color .25s}.category-nav button:last-child{border-right:0}.category-nav button:hover,.category-nav button:focus-visible,.category-nav button.is-active{background:rgba(255,255,255,.12);color:#fff;outline:none}.category-nav small{display:block;margin-bottom:6px;font-size:12px;letter-spacing:.14em}
    .content{padding:54px 0 112px}.showcase{display:grid;grid-template-columns:minmax(0,1.86fr) minmax(300px,1fr);gap:clamp(38px,5vw,76px);align-items:stretch;transition:opacity .18s ease,transform .32s var(--ease)}.showcase.is-switching{opacity:0;transform:translateY(8px)}.showcase-media{position:relative;aspect-ratio:16/9;overflow:hidden;border:1px solid rgba(255,255,255,.42);border-radius:26px;background:#07131d;box-shadow:0 30px 80px rgba(0,56,92,.25)}.showcase-media img{width:100%;height:100%;object-fit:cover}.showcase-media iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#07131d}.play{position:absolute;left:50%;top:50%;display:grid;width:82px;height:82px;place-items:center;padding:0;border:1px solid rgba(255,255,255,.78);border-radius:50%;background:rgba(5,20,30,.42);color:#fff;cursor:pointer;font-size:25px;transform:translate(-50%,-50%);backdrop-filter:blur(8px);transition:background .25s,color .25s,transform .35s var(--ease)}.play:hover,.play:focus-visible{background:#fff;color:var(--blue);outline:none;transform:translate(-50%,-50%) scale(1.06)}
    .showcase-copy{display:flex;min-width:0;flex-direction:column;padding:6px 0}.counter{margin:0 0 auto;color:rgba(255,255,255,.74);font-size:14px;font-weight:760;letter-spacing:.16em}.showcase-copy h2{margin:40px 0 12px;font-size:clamp(48px,5vw,78px);font-weight:560;letter-spacing:-.055em;line-height:.94}.type{margin:0;color:#fff;font-size:16px;font-weight:720;letter-spacing:.04em}.description{margin:24px 0 0;color:rgba(255,255,255,.82);font-size:17px;line-height:1.75}.contents{margin:28px 0 0;padding-top:23px;border-top:1px solid var(--line);color:rgba(255,255,255,.67);font-size:15px;line-height:1.7}.detail-link{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;margin-top:auto;padding:28px 0 7px;border-bottom:1px solid rgba(255,255,255,.68);font-size:17px;font-weight:760;transition:gap .3s var(--ease),color .25s}.detail-link:hover,.detail-link:focus-visible{gap:16px;color:#fff;outline:none}
    .directory-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-top:72px;padding:0 0 18px;border-bottom:1px solid var(--line)}.directory-head p{margin:0;color:rgba(255,255,255,.7);font-size:13px;font-weight:720;letter-spacing:.16em}.directory-head span{font-size:14px;color:rgba(255,255,255,.52)}.project-index{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);overflow-x:auto;scroll-snap-type:x proximity;scrollbar-color:rgba(255,255,255,.62) transparent}.index-item{position:relative;display:grid;min-height:126px;align-content:space-between;padding:20px 24px 20px 0;border:0;border-bottom:1px solid var(--line);background:transparent;color:rgba(255,255,255,.5);text-align:left;cursor:pointer;scroll-snap-align:start;transition:color .3s,background .3s,padding .3s var(--ease)}.index-item::after{content:"";position:absolute;left:0;right:24px;bottom:-1px;height:2px;background:#fff;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}.index-item:hover,.index-item:focus-visible,.index-item.is-active{color:#fff;outline:none}.index-item.is-active{padding-left:18px;background:rgba(255,255,255,.08)}.index-item.is-active::after{transform:scaleX(1)}.index-number{font-size:12px;font-weight:760;letter-spacing:.15em}.index-title{font-size:18px;font-weight:720;line-height:1.35}
    .footer{display:flex;justify-content:space-between;gap:24px;padding:30px 0 42px;border-top:1px solid var(--line);color:rgba(255,255,255,.64);font-size:14px;letter-spacing:.08em}
    @media(max-width:980px){.hero,.showcase{grid-template-columns:1fr}.showcase-copy{min-height:430px}.counter{margin-bottom:0}.detail-link{margin-top:34px}}
    @media(max-width:680px){.shell{width:calc(100% - 36px)}.topbar{min-height:74px}.brand{font-size:14px}.back{min-height:42px;padding:0 14px;font-size:14px}.hero{padding:66px 0 44px;gap:30px}h1{font-size:56px}.intro{font-size:17px}.category-nav{grid-template-columns:1fr}.category-nav button{min-height:64px;border-right:0;border-bottom:1px solid var(--line)}.category-nav button:last-child{border-bottom:0}.content{padding:34px 0 80px}.showcase{gap:28px}.showcase-media{border-radius:18px}.play{width:62px;height:62px}.showcase-copy{min-height:0;padding:0}.showcase-copy h2{margin-top:26px;font-size:52px}.description{font-size:16px}.directory-head{margin-top:52px;align-items:flex-start;flex-direction:column}.directory-head span{display:none}.project-index{grid-auto-columns:76vw}.index-item{min-height:108px}.footer{flex-direction:column}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="topbar shell"><a class="brand" href="/">Yibo Gao</a><a class="back" href="/">← 返回首页</a></header>
  <main class="shell">
    <section class="hero" aria-labelledby="page-title">
      <div><p class="eyebrow">06 / AIGC VIDEO</p><h1 id="page-title">动态影像。</h1></div>
      <p class="intro">从商业产品表达，到短片内容与连续漫剧。一次聚焦一个项目，按目录快速浏览完整创作。</p>
    </section>
    <nav class="category-nav" aria-label="视频项目分类" role="tablist">
      <button type="button" data-category="tvc" aria-selected="false"><small>01 / COMMERCIAL</small>TVC广告</button>
      <button type="button" data-category="video" aria-selected="false"><small>02 / VIDEO</small>AIGC视频</button>
      <button class="is-active" type="button" data-category="drama" aria-selected="true"><small>03 / DRAMA</small>AIGC漫剧</button>
    </nav>
    <section class="content" aria-live="polite">
      <div class="showcase" id="showcase">
        <div class="showcase-media" id="showcaseMedia"><img id="projectCover" alt=""><button class="play" id="playButton" type="button" aria-label="播放项目视频">▶</button></div>
        <div class="showcase-copy">
          <p class="counter" id="projectCounter"></p><h2 id="projectTitle"></h2><p class="type" id="projectType"></p><p class="description" id="projectDescription"></p><p class="contents" id="projectContents"></p><a class="detail-link" id="projectLink" href="">查看完整项目 <span aria-hidden="true">↗</span></a>
        </div>
      </div>
      <div class="directory-head"><p>PROJECT INDEX / 项目目录</p><span>选择项目，上方主展示区将同步切换</span></div>
      <div class="project-index" id="projectIndex" role="tablist" aria-label="当前分类项目目录"></div>
    </section>
  </main>
  <footer class="footer shell"><span>AIGC CONTENT CREATOR</span><span>© 2026 YIBO GAO</span></footer>
  <script>
    const projects={
      tvc:[
        {title:'AERIN ONE',type:'智能产品 TVC',description:'以克制的未来感语言呈现智能手表的造型、交互与健康功能。',contents:'成片 / 剧本 / 分镜 / 产品 / 场景 / 道具',cover:'/assets/videos/aerin-one/cover.jpg',href:'/videos/aerin-one/',bvid:'BV1FNYS6fE2f'},
        {title:'AGG唇釉',type:'美妆产品 TVC',description:'围绕唇色、质地与感官氛围展开的美妆产品视觉短片。',contents:'成片 / 剧本 / 分镜 / 产品 / 人物 / 场景 / 道具',cover:'/assets/videos/agg-lip-glaze/cover.jpg',href:'/videos/agg-lip-glaze/',bvid:'BV16NYS6ZEiR'},
        {title:'AURORA',type:'智能家电 TVC',description:'以家庭清洁场景连接产品外观、核心功能与内部结构展示。',contents:'成片 / 剧本 / 分镜 / 产品 / 场景 / 道具',cover:'/assets/videos/aurora-floor-cleaner/cover.jpg',href:'/videos/aurora-floor-cleaner/',bvid:'BV16NYS6ZEEb'},
        {title:'LOMI',type:'环保科技 TVC',description:'从厨房使用情境进入厨余处理过程，呈现产品设计与科学视觉。',contents:'成片 / 剧本 / 分镜 / 产品 / 科学视觉 / 场景',cover:'/assets/videos/lomi-food-recycler/cover.jpg',href:'/videos/lomi-food-recycler/',bvid:'BV16NYS6ZEtV'}
      ],
      video:[
        {title:'OOTD｜变装',type:'AIGC 时尚短片',description:'同一人物在连续镜头中完成妆发、服装与气质的快速变奏。',contents:'成片 / 剧本 / 分镜 / 人物造型 / 场景',cover:'/assets/videos/ootd-transform/cover.jpg',href:'/videos/ootd-transform/',bvid:'BV1KJes6KEFX'},
        {title:'OOTD｜Lookbook',type:'AIGC 时尚短片',description:'以四组风格化穿搭构成完整 Lookbook，突出人物与服装的一致性。',contents:'成片 / 剧本 / 分镜 / 人物 / 服装 / 卡片 / 场景',cover:'/assets/videos/ootd/cover.jpg',href:'/videos/ootd/',bvid:'BV1FNYS6fEmA'},
        {title:'最后一波',type:'AIGC 游戏短片',description:'一支以末日生存、塔防建造与 Boss 波次为核心的游戏概念短片。',contents:'成片 / 剧本 / 分镜 / 人物 / 场景 / 特效 / 道具',cover:'/assets/videos/final-wave/cover.jpg',href:'/videos/final-wave/',bvid:'BV16NYS6ZEzT'}
      ],
      drama:[
        {title:'寄居者',type:'AIGC 剧情短片',description:'一部围绕身份、家庭关系与秘密展开的仿真人剧情作品。',contents:'成片 / 剧本 / 分镜 / 人物 / 场景 / 道具',cover:'/assets/videos/jijuzhe/cover.jpg',href:'/videos/jijuzhe/',bvid:'BV1rNYS6ZEMf'},
        {title:'赛博渝州',type:'AIGC 连续漫剧',description:'在赛博重庆的城市想象中，以双集叙事连接人物、世界观与行动冲突。',contents:'双集成片 / 剧本 / 分镜 / 人物 / 场景 / 道具',cover:'/assets/videos/cyber-yuzhou/cover.jpg',href:'/videos/cyber-yuzhou/',bvid:'BV1rNYS6fE8b'},
        {title:'满月',type:'AIGC 剧情短片',description:'以医疗空间与满月意象展开的一部暗色悬疑剧情作品。',contents:'成片 / 剧本 / 分镜 / 人物 / 场景 / 道具',cover:'/assets/videos/full-moon/cover.jpg',href:'/videos/full-moon/',bvid:'BV19WtE62ETr'},
        {title:'被藏了二十五年的母亲',type:'AIGC 剧情短片',description:'围绕被掩埋的家庭秘密与迟到的相认展开的亲情悬疑故事。',contents:'成片 / 剧本 / 分镜 / 人物 / 场景 / 道具',cover:'/assets/videos/hidden-mother/cover.jpg',href:'/videos/hidden-mother/',bvid:'BV1xJes6KEy2'},
        {title:'三个孩子，一个都不给',type:'AIGC 剧情短片',description:'以家庭关系、利益冲突与身份反转推动的高密度情节短片。',contents:'成片 / 剧本 / 分镜 / 人物 / 场景 / 道具',cover:'/assets/videos/three-children/cover.jpg',href:'/videos/three-children/',bvid:'BV1cNYS6fEjr'},
        {title:'第十八封信',type:'AIGC 剧情短片',description:'从一封被延迟发现的信件切入，逐步展开证据与记忆的悬疑叙事。',contents:'成片 / 剧本 / 分镜 / 人物 / 场景 / 道具',cover:'/assets/videos/eighteenth-letter/cover.jpg',href:'/videos/eighteenth-letter/',bvid:'BV1FNYS6fEfc'},
        {title:'黑账',type:'AIGC 剧情短片',description:'围绕隐秘账本、犯罪网络与卧底身份展开的都市悬疑作品。',contents:'成片 / 剧本 / 分镜 / 人物 / 场景 / 道具',cover:'/assets/videos/black-ledger/cover.jpg',href:'/videos/black-ledger/',bvid:'BV1cNYS6fEjy'}
      ]
    };
    const categoryTabs=[...document.querySelectorAll('[data-category]')];
    const els={showcase:document.getElementById('showcase'),media:document.getElementById('showcaseMedia'),cover:document.getElementById('projectCover'),play:document.getElementById('playButton'),counter:document.getElementById('projectCounter'),title:document.getElementById('projectTitle'),type:document.getElementById('projectType'),description:document.getElementById('projectDescription'),contents:document.getElementById('projectContents'),link:document.getElementById('projectLink'),index:document.getElementById('projectIndex')};
    let activeCategory='drama',activeIndex=0,switchTimer;
    function pad(value){return String(value).padStart(2,'0')}
    function renderDirectory(){els.index.innerHTML='';projects[activeCategory].forEach((project,index)=>{const button=document.createElement('button');button.type='button';button.className='index-item'+(index===activeIndex?' is-active':'');button.setAttribute('role','tab');button.setAttribute('aria-selected',String(index===activeIndex));button.innerHTML=`<span class="index-number">${pad(index+1)}</span><span class="index-title">${project.title}</span>`;button.addEventListener('click',()=>selectProject(index));els.index.append(button)})}
    function updateProject(){const list=projects[activeCategory],project=list[activeIndex];els.media.querySelector('iframe')?.remove();els.cover.hidden=false;els.play.hidden=false;els.cover.src=project.cover;els.cover.alt=`${project.title}项目封面`;els.play.setAttribute('aria-label',`播放《${project.title}》项目视频`);els.counter.textContent=`${pad(activeIndex+1)} / ${pad(list.length)}`;els.title.textContent=project.title;els.type.textContent=project.type;els.description.textContent=project.description;els.contents.textContent=project.contents;els.link.href=project.href;[...els.index.children].forEach((button,index)=>{const on=index===activeIndex;button.classList.toggle('is-active',on);button.setAttribute('aria-selected',String(on))})}
    function selectProject(index){if(index===activeIndex)return;activeIndex=index;clearTimeout(switchTimer);els.showcase.classList.add('is-switching');switchTimer=setTimeout(()=>{updateProject();els.showcase.classList.remove('is-switching')},180)}
    function selectCategory(category){if(category===activeCategory)return;activeCategory=category;activeIndex=0;categoryTabs.forEach(tab=>{const on=tab.dataset.category===category;tab.classList.toggle('is-active',on);tab.setAttribute('aria-selected',String(on))});clearTimeout(switchTimer);els.showcase.classList.add('is-switching');switchTimer=setTimeout(()=>{renderDirectory();updateProject();els.showcase.classList.remove('is-switching')},180)}
    categoryTabs.forEach(tab=>tab.addEventListener('click',()=>selectCategory(tab.dataset.category)));
    els.play.addEventListener('click',()=>{const project=projects[activeCategory][activeIndex],frame=document.createElement('iframe');frame.src=`https://player.bilibili.com/player.html?bvid=${project.bvid}&autoplay=1&high_quality=1`;frame.title=`播放《${project.title}》`;frame.allow='autoplay; fullscreen; picture-in-picture';frame.allowFullscreen=true;els.media.append(frame);els.cover.hidden=true;els.play.hidden=true});
    renderDirectory();updateProject();
  </script>
</body>
</html>
