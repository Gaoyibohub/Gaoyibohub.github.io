<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eee8de">
  <title>放妥｜品牌视觉与场景系统</title>
  <style>
    :root{--paper:#f1ece4;--paper2:#faf7f1;--ink:#26323a;--blue:#5f7686;--gold:#b27c35;--line:rgba(72,64,53,.18);--shadow:0 24px 70px rgba(58,45,31,.12)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}button,a{font:inherit}a{color:inherit;text-decoration:none}
    .top{position:fixed;z-index:50;top:18px;left:50%;transform:translateX(-50%);width:min(1500px,calc(100% - 48px));height:72px;padding:0 22px;border:1px solid rgba(255,255,255,.35);border-radius:36px;background:rgba(40,44,47,.76);backdrop-filter:blur(18px);display:flex;align-items:center;gap:28px;color:#fff;box-shadow:0 12px 35px rgba(0,0,0,.14)}
    .brand{font-family:serif;font-size:24px;white-space:nowrap}.top nav{margin-left:auto;display:flex;gap:6px;overflow:auto}.top nav a{padding:13px 18px;border-radius:24px;white-space:nowrap;font-size:15px}.top nav a:hover,.top nav a.active{background:#fff;color:#5a4638}
    .back{position:fixed;z-index:51;top:105px;left:max(24px,calc((100vw - 1500px)/2));min-width:190px;height:58px;border:1px solid rgba(255,255,255,.42);border-radius:20px;background:rgba(36,38,43,.82);color:#fff;font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 15px 35px rgba(0,0,0,.14)}
    .rail{position:fixed;z-index:20;right:22px;top:50%;transform:translateY(-50%);display:grid;gap:9px}.rail a{width:11px;height:11px;border-radius:50%;background:rgba(54,67,74,.25);border:1px solid rgba(255,255,255,.7)}.rail a:hover{background:var(--gold);transform:scale(1.35)}
    main{overflow:hidden}.hero{height:100svh;min-height:720px;position:relative;background:#d8d7d2}.hero img{width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),transparent 28%,rgba(0,0,0,.08))}.scroll-cue{position:absolute;z-index:2;bottom:25px;left:50%;transform:translateX(-50%);color:#fff;letter-spacing:.22em;font-size:12px;text-shadow:0 2px 8px #000}
    .chapter{width:min(1540px,calc(100% - 72px));margin:0 auto;padding:128px 0}.chapter-head{display:grid;grid-template-columns:1fr auto;gap:25px;align-items:end;margin-bottom:42px}.eyebrow{color:var(--gold);letter-spacing:.2em;font-size:13px}.chapter h2{margin:10px 0 0;font-family:serif;font-weight:400;font-size:clamp(40px,5vw,76px);line-height:1.08}.chapter-head p{max-width:520px;line-height:1.9;color:#647077}
    .frame{margin:0;border:0;padding:0;width:100%;display:block;background:#ded8ce;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);cursor:zoom-in}.frame img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#ebe6de}.stack{display:grid;gap:52px}.duo{display:grid;grid-template-columns:1fr 1fr;gap:28px}.duo .frame{border-radius:22px}.caption{display:flex;justify-content:space-between;gap:20px;padding:15px 4px 0;color:#74736e;font-size:13px;letter-spacing:.08em}
    .reveal{opacity:0;transform:translateY(44px);transition:opacity .75s ease,transform .75s ease}.reveal.visible{opacity:1;transform:none}
    .switcher{padding:28px;background:rgba(255,255,255,.46);border:1px solid var(--line);border-radius:34px;box-shadow:var(--shadow)}.tabs{display:flex;gap:10px;overflow:auto;margin-bottom:22px}.tabs button{border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);padding:13px 20px;white-space:nowrap;cursor:pointer}.tabs button.active,.tabs button:hover{background:var(--ink);color:#fff}.switch-image{transition:opacity .22s ease}.switch-image.changing{opacity:.15}
    .warm{background:linear-gradient(180deg,#efeae2,#f9f6f0)}.blue{background:linear-gradient(180deg,#dce3e5,#f1ece4)}.closing{position:relative;height:100svh;min-height:680px}.closing img{width:100%;height:100%;object-fit:cover}.closing .closing-text{position:absolute;left:8vw;bottom:8vh;color:#fff;letter-spacing:.14em}
    dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100vw;height:100vh}dialog::backdrop{background:rgba(15,17,18,.92)}.lightbox{width:100%;height:100%;display:grid;place-items:center;padding:35px}.lightbox img{max-width:96vw;max-height:92vh;object-fit:contain}.close{position:fixed;right:25px;top:22px;width:50px;height:50px;border:1px solid #fff;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;font-size:24px;cursor:pointer}
    @media(max-width:800px){.top{top:10px;width:calc(100% - 20px);height:62px;padding:0 12px;gap:10px}.brand{font-size:18px}.top nav a{padding:10px 13px;font-size:13px}.back{top:82px;left:14px;min-width:160px;height:52px;font-size:16px}.rail{display:none}.hero{min-height:600px;height:82svh}.hero img{object-position:center}.chapter{width:calc(100% - 24px);padding:90px 0}.chapter-head{grid-template-columns:1fr;margin-bottom:28px}.chapter h2{font-size:42px}.duo{grid-template-columns:1fr}.stack{gap:28px}.frame,.duo .frame{border-radius:18px}.switcher{padding:12px;border-radius:22px}.caption{font-size:11px}.closing{height:72svh;min-height:520px}.closing img{object-position:center}.scroll-cue{display:none}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}}
  </style>
</head>
<body>
  <header class="top"><a class="brand" href="/">放妥 FANGTUO</a><nav><a href="/">作品集首页</a><a href="/oppo/">OPPO</a><a href="/suning/">SUNING 618</a><a class="active" href="/fangtuo/">放妥</a><a href="/motion/">漫剧制作</a></nav></header>
  <button class="back" id="back">← 返回上一级</button>
  <aside class="rail" aria-label="章节导航"><a href="#cover" title="封面"></a><a href="#strategy" title="策略"></a><a href="#symbol" title="符号"></a><a href="#system" title="系统"></a><a href="#journey" title="旅程"></a><a href="#closing" title="结尾"></a></aside>
  <main>
    <section class="hero" id="cover"><img src="/assets/fangtuo/case-01.png" alt="放妥品牌封面"><span class="scroll-cue">SCROLL TO EXPLORE ↓</span></section>
    <section class="chapter warm" id="strategy"><div class="chapter-head reveal"><div><span class="eyebrow">01 / STRATEGY & INSIGHT</span><h2>从设备互联，走向<br>有边界的环境支持</h2></div></div><div class="stack">
      <button class="frame reveal" data-lightbox><img src="/assets/fangtuo/case-02.png" alt="项目背景"></button>
      <div class="duo"><button class="frame reveal" data-lightbox><img src="/assets/fangtuo/case-03.png" alt="用户洞察"></button><button class="frame reveal" data-lightbox><img src="/assets/fangtuo/case-04.png" alt="什么是放妥"></button></div>
      <button class="frame reveal" data-lightbox><img src="/assets/fangtuo/case-05.png" alt="品牌定位与边界"></button>
      <button class="frame reveal" data-lightbox><img src="/assets/fangtuo/case-06.png" alt="设计母题提取"></button>
    </div></section>
    <section class="chapter blue" id="symbol"><div class="chapter-head reveal"><div><span class="eyebrow">02 / SYMBOL & MOTION</span><h2>一个符号，表达<br>系统的不同状态</h2></div></div>
      <div class="switcher reveal" data-switcher><div class="tabs"><button class="active" data-src="/assets/fangtuo/case-07.png">动态与数字状态</button><button data-src="/assets/fangtuo/case-08.png">Logo 与超级符号</button></div><button class="frame" data-lightbox><img class="switch-image" src="/assets/fangtuo/case-07.png" alt="放妥符号系统"></button></div>
      <div class="stack" style="margin-top:52px"><button class="frame reveal" data-lightbox><img src="/assets/fangtuo/case-09.png" alt="品牌人格系统"></button><button class="frame reveal" data-lightbox><img src="/assets/fangtuo/case-10.png" alt="IP造型推导"></button></div>
    </section>
    <section class="chapter warm" id="system"><div class="chapter-head reveal"><div><span class="eyebrow">03 / BRAND SYSTEM</span><h2>从角色动作，到<br>跨设备视觉资产</h2></div></div><div class="stack"><button class="frame reveal" data-lightbox><img src="/assets/fangtuo/case-11.png" alt="双层动作系统"></button><div class="duo"><button class="frame reveal" data-lightbox><img src="/assets/fangtuo/case-12.png" alt="颜色与情绪系统"></button><button class="frame reveal" data-lightbox><img src="/assets/fangtuo/case-13.png" alt="IP视觉资产系统"></button></div></div></section>
    <section class="chapter blue" id="journey"><div class="chapter-head reveal"><div><span class="eyebrow">04 / USER JOURNEY</span><h2>从回家触发，到<br>卧室环境归还</h2></div></div>
      <div class="switcher reveal" data-switcher><div class="tabs"><button class="active" data-src="/assets/fangtuo/case-14.png">旅程总览</button><button data-src="/assets/fangtuo/case-15.png">回家触发</button><button data-src="/assets/fangtuo/case-16.png">灯光响应</button><button data-src="/assets/fangtuo/case-17.png">卧室三状态</button></div><button class="frame" data-lightbox><img class="switch-image" src="/assets/fangtuo/case-14.png" alt="放妥用户旅程"></button></div>
    </section>
    <section class="closing" id="closing"><img src="/assets/fangtuo/case-18.png" alt="放妥品牌结尾"><div class="closing-text">FANGTUO / A SOFT PLACE TO HOLD WHAT YOU FEEL.</div></section>
  </main>
  <dialog id="dialog"><div class="lightbox"><button class="close" aria-label="关闭">×</button><img alt="放大预览"></div></dialog>
  <script>
    const back=document.querySelector('#back');back.addEventListener('click',()=>history.length>1?history.back():location.assign('/'));
    const observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));
    document.querySelectorAll('[data-switcher]').forEach(box=>{const img=box.querySelector('.switch-image');box.querySelectorAll('.tabs button').forEach(btn=>btn.addEventListener('click',()=>{if(btn.classList.contains('active'))return;box.querySelector('.active')?.classList.remove('active');btn.classList.add('active');img.classList.add('changing');setTimeout(()=>{img.src=btn.dataset.src;img.classList.remove('changing')},180)}))});
    const dialog=document.querySelector('#dialog'),preview=dialog.querySelector('img');document.querySelectorAll('[data-lightbox]').forEach(btn=>btn.addEventListener('click',()=>{preview.src=btn.querySelector('img').src;dialog.showModal()}));dialog.querySelector('.close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog||e.target.classList.contains('lightbox'))dialog.close()});
  </script>
</body>
</html>
