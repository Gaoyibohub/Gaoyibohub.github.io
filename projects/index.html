<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目案例 — 高一博 AIGC Portfolio</title>
  <meta name="description" content="高一博的品牌视觉传播项目案例。">
  <style>
    :root { color-scheme: dark; --blue: #078fd2; --white: #fff; --ease: cubic-bezier(.16,1,.3,1); }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 82% 9%, rgba(202,246,255,.28), transparent 28%),
        radial-gradient(circle at 10% 92%, rgba(0,92,181,.28), transparent 32%),
        linear-gradient(145deg, #13a7e4, #078fd2 48%, #0879bf);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(255,255,255,.065) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.065) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: linear-gradient(to bottom, transparent, #000 10%, #000 90%, transparent);
    }
    a { color: inherit; }
    .page { position: relative; width: min(100%, 1568px); margin: 0 auto; padding: 32px 64px 96px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; font-size: 16px; font-weight: 680; letter-spacing: .1em; text-transform: uppercase; }
    .brand::before { content: ""; width: 18px; height: 18px; border: 5px solid currentColor; border-right-color: transparent; border-radius: 50%; transform: rotate(-24deg); }
    .back { display: inline-flex; align-items: center; min-height: 48px; padding: 0 18px; border: 1px solid rgba(255,255,255,.5); border-radius: 12px; background: rgba(255,255,255,.12); text-decoration: none; font-size: 16px; font-weight: 650; backdrop-filter: blur(12px); transition: background .25s ease; }
    .back:hover, .back:focus-visible { outline: none; background: rgba(255,255,255,.22); }
    .heading { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 48px; margin-top: 96px; padding-bottom: 32px; border-bottom: 1px solid rgba(255,255,255,.35); }
    .eyebrow { margin: 0 0 20px; color: rgba(255,255,255,.72); font-size: 13px; font-weight: 650; letter-spacing: .26em; text-transform: uppercase; }
    h1 { max-width: 900px; margin: 0; font-size: 64px; font-weight: 560; letter-spacing: -.04em; line-height: 1; }
    .count { color: rgba(255,255,255,.72); font-size: 14px; letter-spacing: .18em; }
    .project-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 18px; margin-top: 26px; }
    .project-card { position: relative; min-height: 0; aspect-ratio: 16/10; overflow: hidden; border: 1px solid rgba(255,255,255,.38); border-radius: 32px; background: rgba(0,63,103,.3); box-shadow: 0 34px 80px rgba(0,67,128,.24); }
    .project-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; transition: transform 1s var(--ease), filter .6s ease; }
    .project-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(2,35,67,.05), rgba(0,32,58,.82)); pointer-events: none; }
    .project-card__link { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; justify-content: flex-end; padding: clamp(26px,3vw,46px); text-decoration: none; }
    .project-card:hover img, .project-card:focus-within img { transform: scale(1.045); filter: saturate(1.08); }
    .project-number { color: rgba(255,255,255,.7); font-size: 13px; font-weight: 650; letter-spacing: .22em; }
    .project-name { display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; margin-top: 12px; }
    .project-name h2 { margin: 0; font-size: clamp(42px,5vw,74px); font-weight: 500; letter-spacing: -.055em; }
    .project-name span { display: grid; width: 54px; height: 54px; place-items: center; flex: 0 0 auto; border: 1px solid rgba(255,255,255,.54); border-radius: 50%; background: rgba(255,255,255,.14); font-size: 24px; transition: transform .35s var(--ease), background .35s ease; }
    .project-card:hover .project-name span, .project-card:focus-within .project-name span { transform: translate(5px,-5px); background: #fff; color: #087fc4; }
    .project-meta { margin: 16px 0 0; color: rgba(255,255,255,.82); font-size: 16px; line-height: 1.65; }
    .project-card--tongpin { background:#d9d0f7; }
    .project-card--tongpin::after { background:linear-gradient(180deg,rgba(28,14,62,.02),rgba(27,15,59,.78)); }
    .footerline { display: flex; justify-content: space-between; gap: 20px; margin-top: 22px; color: rgba(255,255,255,.6); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
    @media (max-width: 900px) {
      .page { padding: 32px; }
      .heading { grid-template-columns: 1fr; gap: 18px; }
      .project-grid { grid-template-columns: 1fr; }
      .project-card { aspect-ratio: 16/10; }
    }
    @media (max-width: 560px) {
      .page { padding: 22px 18px 64px; }
      .brand { font-size: 12px; }
      h1 { font-size: clamp(44px,13vw,60px); }
      .project-card { aspect-ratio: 4/3; border-radius: 24px; }
      .footerline { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="/">Yibo Gao</a>
      <a class="back" href="/">← 返回首页</a>
    </header>

    <section class="heading" aria-labelledby="project-index-title">
      <div>
        <p class="eyebrow">05 / Project Index</p>
        <h1 id="project-index-title">选择一个项目，<br>进入完整案例。</h1>
      </div>
      <span class="count">02 PROJECTS</span>
    </section>

    <section class="project-grid" aria-label="品牌项目列表">
      <article class="project-card">
        <img src="/assets/gangpao/core.png" alt="刚泡菠萝生姜果味饮品视觉" width="1672" height="941">
        <a class="project-card__link" href="/projects/gangpao/">
          <span class="project-number">01 / BRAND CAMPAIGN</span>
          <div class="project-name"><h2>刚泡</h2><span aria-hidden="true">↗</span></div>
          <p class="project-meta">果味饮品视觉传播项目<br>AI 视觉 · 产品视觉 · 社交传播 · Campaign</p>
        </a>
      </article>

      <article class="project-card project-card--tongpin" id="tongpin">
        <img src="/assets/tongpin/hero.png" alt="同频护肤视觉项目首屏" width="1672" height="941">
        <a class="project-card__link" href="/projects/tongpin/">
          <span class="project-number">02 / BEAUTY VISUAL</span>
          <div class="project-name"><h2>同频</h2><span aria-hidden="true">↗</span></div>
          <p class="project-meta">护肤视觉传播项目<br>品牌视觉 · 概念叙事 · 社交内容</p>
        </a>
      </article>
    </section>

    <footer class="footerline"><span>AIGC Content Creator</span><span>© 2026 Yibo Gao</span></footer>
  </main>
</body>
</html>
